        const width = 1600;
        const height = 660;

        function drawDynamicsTree(data_1,data_2) {
            d3.select("#chart").html("");

            // 创建力导向布局
            d3.select("#chart")
                .append("defs")
                .append("radialGradient")
                .attr("id", "bubbleGradient")
                .attr("cx", "70%")
                .attr("cy", "25%")
                .attr("r", "50%")
                .attr("fx", "40%")
                .attr("fy", "25%")
                .selectAll("stop")
                .data([
                        { offset: "0%", color: "#ffffff", opacity: 1 },
                        { offset: "100%", color: "#008cff", opacity: 1 }
                    ])
                .enter()
                .append("stop")
                .attr("offset", d => d.offset)
                .style("stop-color", d => d.color)
                .style("stop-opacity", d => d.opacity);
            const nodes = data_1;
            const links = data_2;

            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width)
                .attr("height",height)
                .append("g");
                // .attr("transform", "translate(100,20)");
                
            const radiusScale = d3.scaleLinear()
                .domain([d3.min(nodes, d => d.group), d3.max(nodes, d => d.group)])
                .range([35, 15]);

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
                    const sourceRadius = radiusScale(d.source.group);
                    const targetRadius = radiusScale(d.target.group);
                    const baseLength = (sourceRadius + targetRadius);
                    return Math.min(500, Math.max(200, baseLength));
                }))
                .force("charge", d3.forceManyBody().strength(-100))
                .force("center", d3.forceCenter(width/2, height/2));

            // 创建连线
            const link = svg.append("g")
                .attr("stroke-opacity", 0.6)
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "link");

            // 创建连线标签
            const linkLabel = svg.append("g")
                .attr("class", "link-labels")
                .selectAll("text")
                .data(links)
                .join("text")
                .attr("class", "label")
                .text(d => d.label);

            // 创建节点
            const node = svg.append("g")
                .attr("class", "shadow")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("class", "node")
                .attr("r", d => {
                    const maxGroup = d3.max(nodes, n => n.group);
                    const minGroup = d3.min(nodes, n => n.group);
                    const maxRadius = 35; // 最大半径
                    const minRadius = 15; // 最小半径
                    return maxRadius - (d.group - minGroup) * ((maxRadius - minRadius) / (maxGroup - minGroup));
                })
                .style("fill", "url(#bubbleGradient)")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                    .on("click", function (event, d) {
                        var keyword = d.id.replace(/—权\d+/g,'').replace(/—\d+/g,'').replace(/(\d+)/g,'').replace(/（\d+）/g,'');
                        highlightText (keyword)
                    });
            // 创建节点文本
            const nodeText = svg.append("g")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .attr("class", "label")
                .attr("dy", ".35em")
                .text(d => d.id);

            // 更新节点和连线位置
            simulation.on("tick", () => {
                link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

                linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);

                node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

                nodeText
                .attr("x", d => d.x)
                .attr("y", d => d.y);
            });

            // 拖拽事件处理函数
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            function boundaryCheck() {
                nodes.forEach(node => {
                    const radius = radiusScale(node.group);
                    if (node.x - radius < 0) {
                        node.x = radius;
                        node.vx = -node.vx;
                    } else if (node.x + radius > width) {
                        node.x = width - radius;
                        node.vx = -node.vx;
                    }
                    if (node.y - radius < 0) {
                        node.y = radius;
                        node.vy = -node.vy;
                    } else if (node.y + radius > height) {
                        node.y = height - radius;
                        node.vy = -node.vy;
                    }
                });
            }
            simulation.on("tick", () => {
                boundaryCheck();
                link
                   .attr("x1", d => d.source.x)
                   .attr("y1", d => d.source.y)
                   .attr("x2", d => d.target.x)
                   .attr("y2", d => d.target.y);

                linkLabel
                   .attr("x", d => (d.source.x + d.target.x) / 2)
                   .attr("y", d => (d.source.y + d.target.y) / 2);

                node
                   .attr("cx", d => d.x)
                   .attr("cy", d => d.y);

                nodeText
                   .attr("x", d => d.x)
                   .attr("y", d => d.y);
            });
        }
    </script>
    <script>
        function highlightText(keyword) {
            // 获取模拟输入框的 div 元素
            const inputDiv = document.getElementById('claimInput');
            // 获取 div 中的文本内容
            let text = inputDiv.innerHTML;
            var highlightedText = text.replaceAll('<span class="highlight">', '').replaceAll('</span>', '');
            // 要高亮显示的关键字
            // 使用正则表达式匹配关键字并替换为包含 span 标签的高亮文本
            highlightedText = highlightedText.replace(new RegExp(keyword, 'g'), '<span class="highlight">$&</span>');
            // 将替换后的内容重新赋值给 div 的 innerHTML
            inputDiv.innerHTML = highlightedText;
        }
    </script>
    <script>
        async function parseClaim() {
            const prompt = document.getElementById('claimInput').value.replace(/%/g,"%25");
            const analyzeBtn = document.getElementById('analyzeBtn');
            var data = {}
            if (!prompt) return
            analyzeBtn.textContent = '';
            analyzeBtn.classList.add('loading');
            analyzeBtn.disabled = true;

            try {
                const response = await fetch(`/api/doubao?type=analyze&prompt=${prompt}`, {method: 'POST'});
                data = await response.json();
                data = data['reply'].replace(/[\n ]/g,'').replace(/'/g,'"');

                hierarchy = JSON.parse(data);
                drawTree(hierarchy);
                document.getElementById('tree-container').style.display = 'block';
                document.getElementById('chart').style.display = 'none';
            } catch (error) {
                console.log(`Error:${error.message}`);
            }
            analyzeBtn.textContent = '静态解析';
            analyzeBtn.classList.remove('loading');
            analyzeBtn.disabled = false;
        }

        function drawTree(data) {
            d3.select("#tree-container").html("");
            d3.select("#chart").html("");
            
            const treeLayout = d3.tree().size([600,1200]); //高，宽 各标签的尺寸
            const root = d3.hierarchy(data);
            treeLayout(root);

            const svg = d3.select("#tree-container")
                .append("svg")
                .attr("width", 3000) // 容器尺寸
                .attr("height",1200)
                .append("g")
                .attr("transform", "translate(100,20)");

            // 绘制连线
            svg.selectAll(".link")
                .data(root.links())
                .enter()
                .append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // 绘制节点
            const node = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`)
                // .on("click", function(event, d) {
                //     // 清除所有高亮
                //     d3.selectAll(".highlight").classed("highlight", false);
                    
                //     // 设置当前元素高亮
                //     if(d.data.featureId) {
                //         d3.selectAll(`span[data-feature="${d.data.featureId}"]`)
                //             .classed("highlight", true);
                //     }
                // });

            node.append("circle")
                .attr("r", 5)
                .attr("fill", d => d.data.color);

            node.append("text")
                .attr("dx",  d => d.children ? -8 : 8)
                .attr("dy", -2)
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name);
        }
    </script>
