        function countElements() {
            const rightText = quill.getText();
            const leftText = document.getElementById('text_mark').value;
            const lines = leftText.split('\n');
            const tableBody = document.getElementById('tableBody');
            
            tableBody.innerHTML = '';

            lines.forEach(line => {
                const [label, name] = line.trim().split(' ');
                const labelRegex = new RegExp(`${name}${label}|${name}\\(${label}\\)|${name}（${label}）`, 'g');
                const nameRegex = new RegExp(name, 'g');
                const labelCount = (rightText.match(labelRegex) || []).length;
                const nameCount = (rightText.match(nameRegex) || []).length;

                const row = tableBody.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                const cell3 = row.insertCell(2);
                const cell4 = row.insertCell(3);

                cell1.textContent = label;
                cell1.title = label;
                cell2.textContent = name;
                cell2.title = name;
                cell3.textContent = labelCount;
                cell3.title = labelCount;
                cell4.textContent = nameCount;
                cell4.title = nameCount;

                if (labelCount === nameCount) {
                    row.style.backgroundColor = '#77b67a';
                } else {
                    row.style.backgroundColor = '#ff7373';
                }
            });
        }

		async function getIP() {
            try {
                const response = await fetch('https://ipinfo.io/json');
                const ip_json = await response.json();
                const ip = ip_json.ip;
                const location = await fetch(`https://ipapi.co/${ip}/json/`);
                const location_json = await location.json();
                const queryString = `tool=write&ip=${ip}&location=${location_json.country_name} ${location_json.region} ${location_json.city}&agent=${navigator.userAgent}}`;
                fetch(`/api/submit_ip?${queryString}`, {method: 'POST'});

                console.error('Error fetching IP:', error);
            }
		}
		window.onload = getIP;

        // 控制窗口展开/折叠
        function toggleChat(expand) {
            isExpanded = expand;
            chatContainer.classList.toggle('expanded', expand);
        }
        // 添加消息
        function addMessage(content, isUser = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            div.textContent = content;
            messagesDiv.appendChild(div);
            // 自动滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            // 延迟显示动画
            setTimeout(() => div.classList.add('visible'), 50);
        }
        
        // 显示正在输入状态
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return typingDiv;
        }
        async function getAIResponse(writeType,prompt) {
            addMessage(prompt, true);
            const typing = showTyping();            
            try {
                const response = await fetch(`/api/doubao?type=${writeType}&prompt=${prompt}`, {method: 'POST'});
                var data = await response.json();
                
                messagesDiv.removeChild(typing);
                const regex = /[#* ]/g;
                data = data['reply'].replace(regex, '')
                data = data.replace(/\n{2,}/g, '\n')
                addMessage(data);
                const text = '\n'+ data +'\n'
                if (text) {
                    return text;
                }
                return `API错误`;
            } catch (error) {
                console.error('请求失败:', error);
                messagesDiv.removeChild(typing);
                return "网络连接异常，请稍后重试";
            }
        }

            var prompt = userInput.value.trim();
           
            if (!prompt) return;

            userInput.value = '';
            var response = await getAIResponse('chat', prompt);

                    function insertTextGradually() {
                        return new Promise((resolve) => {
                            let index = 0;
                            // 设置定时器，每隔 10 毫秒执行一次回调函数
                            const intervalId = setInterval(() => {
                                if (index < text.length) {
                                    // 在 Quill 编辑器的末尾插入当前字符
                                    quill.insertText(quill.getLength() - 1, text[index]);
                                    index++;
                                } else {
                                    // 清除定时器
                                    clearInterval(intervalId);
                                    // 文本插入完成，解决 Promise
                                    resolve();
                                }
                            }, 10);
                        });

                        }

                }, 10);

        document.getElementById('text_mark').addEventListener('blur', function () {
            var figmarks_array = [];
            var selectedIndex = document.getElementById("sortcombobox").selectedIndex;
            var temp_array = document.getElementById("text_mark").value.split(/\n/g);
            if (selectedIndex === 0) {
                for (var mark1 of temp_array){
                    if (mark1.indexOf(/[；;]/g) !== -1){
                        var temp = mark1.split(/[；;]/g)
                        for (var mark2 of temp){
                            if ((mark2.split(/[、]/g)).length > 2){
                                figmarks_array.push(mark2.split(/、/g));
                            }
                            else if ((mark2.split(/[，,]/g).length) > 2){
                                figmarks_array.push(mark2.split(/[，,]/g));
                            }
                            else{
                                figmarks_array.push(mark2.replace(/[、;；]/g, ''));
                            }
                        }
                    }
                    else{
                        figmarks_array = figmarks_array.concat(mark1.split(/[、，,]/g));
                    }
                }
            }
            else if (selectedIndex === 1) {
                for (var mark1 of temp_array){
                    if (mark1.indexOf(/[；;]/g) !== -1){
                        var temp = mark1.split(/[；;]/g)
                        for (var mark2 of temp){
                            if ((mark2.split(/[、]/g)).length > 2){

                            }
                            else if ((mark2.split(/[，,]/g).length) > 2){

                            }
                            else{
                                figmarks_array.push(mark2.replace(/[、;；]/g, ''));
                            }

                    }
                    else{
                        figmarks_array = figmarks_array.concat(mark1.split(/[、，,]/g));
                    }
                }

            );
            // 获取当前光标位置

            }

            var num_length = num.length

                quill.deleteText(cursorPosition - num_length, num_length);

                return 
            }

    <script>
        function checkText(inputValue) {
            // 获取页面元素
            const listTextarea = document.getElementById('text_mark');
            const resultTextarea = document.getElementById('markresult');
            resultTextarea.value = '';
            resultTextarea.style = 'border-radius:5px;height:25px;margin-top:5px;margin-bottom:5px;width:190px;border:none;color:white;background: linear-gradient(90deg, #727272 0%, #ffffff 100%);';
            if (!inputValue) return;
            const regex = /^[0-9a-z]$/i; 
            
            const lines = listTextarea.value.split(/\n/g);
            for (let i = 5; i >= 1; i--) {
                var inputChars = inputValue.slice(-i);
                // 遍历所有组件行
                for (const line of lines) {
                    const cleanedLine = line.trim();
                    if (!cleanedLine) continue; 
                    const num = line.split(' ')[0];
                    if (num === inputChars) {
                        resultTextarea.value = line; 
                        resultTextarea.style = 'border-radius:5px;height:25px;margin-top:5px;margin-bottom:5px;width:190px;border:none;color:white;background:linear-gradient(90deg, rgb(233,99,39) 0%, #ffffff 100%);';
                        return;
                    }
                }
            }
        }
