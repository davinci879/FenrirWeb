<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <title>用户登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }       
        .right-form {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
        }
        .login-box {
            position: absolute;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
            width: 400px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
            background:white;
            z-index: 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px #e8f0fe;
        }

        .error-message {
            color: red;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #51a5ff;
        }
        h2 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 1.0rem;
        }
        .register-link {
            text-align: center;
            margin-top: 1rem;
        }

        .register-link a {
            text-decoration: none;
        }
        #particles-canvas {
            background: linear-gradient(90deg, #2e90ff 0%, #ffffff 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <canvas id="particles-canvas"></canvas>
        <form id="loginForm" class="login-box">
            <h2>登录</h2>
            <label for="loginId">手机号/Email<span class="error-message" id="telephoneError"></span></label>
            <input type="phone" id="telephone" required>
            <label for="password">密码<span class="error-message" id="passwordError"></span></label>
            <input type="password" id="password" required minlength="8"><br><br>
            <button type="submit" id="loginButton">登录</button>
            <div class="register-link">
                <a href="register">立即注册</a><a>    </a><a href="#">忘记密码?</a>
            </div>
        </form>
        
    </div>
    <script>
        // 获取按钮元素
        const button = document.getElementById('loginButton');
        // 为按钮添加点击事件监听器
        button.addEventListener('click', function () {
            // 跳转到指定网址
            window.location.href = 'home';
        });
        
    </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;

            document.getElementById('loginIdError').textContent = '';
            document.getElementById('passwordError').textContent = '';

            const phoneRegex = /^1[3-9]\d{9}$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let hasError = false;

            if (!phoneRegex.test(loginId) && !emailRegex.test(loginId)) {
                document.getElementById('loginIdError').textContent = '请输入正确的手机号或邮箱';
                hasError = true;
            }

            if (hasError) {
                return;
            }

            const data = {
                loginId: loginId,
                password: password
            };

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
           .then(response => response.json())
           .then(result => {
                console.log(result);
                if (result.success) {
                    alert('登录成功！');
                } else {
                    if (result.message.includes('电话/邮箱')) {
                        document.getElementById('loginIdError').textContent = result.message;
                    } else {
                        document.getElementById('passwordError').textContent = result.message;
                    }
                }
            })
           .catch(error => {
                console.error('请求出错:', error);
                document.getElementById('loginIdError').textContent = '请求出错，请稍后再试。';
            });
        });
    </script>
    <script>
        // 粒子系统配置
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: null, y: null, radius: 100 };
                
                this.init();
                this.animate();
                
                window.addEventListener('resize', this.handleResize);
                canvas.addEventListener('mousemove', this.handleMouseMove);
            }

            init() {
                this.handleResize();
                this.createParticles();
            }

            createParticles() {
                const particleCount = Math.floor(this.canvas.width * this.canvas.height / 15000);
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 4 + 1,
                        dx: (Math.random() - 0.5) * 0.5,
                        dy: (Math.random() - 0.5) * 0.5,
                        color: `rgba(255, 255, 200, ${Math.random() * 0.5 + 0.3})`
                    });
                }
            }

            handleResize = () => {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            handleMouseMove = (e) => {
                this.mouse.x = e.clientX;
                this.mouse.y = e.clientY;
            }

            drawParticle(particle) {
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                this.ctx.fillStyle = particle.color;
                this.ctx.fill();
            }

            updateParticles() {
                this.particles.forEach(particle => {
                    // 鼠标互动
                    const dx = particle.x - this.mouse.x;
                    const dy = particle.y - this.mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < this.mouse.radius) {
                        const force = (this.mouse.radius - distance) / this.mouse.radius;
                        particle.x += (dx / distance) * force * 5;
                        particle.y += (dy / distance) * force * 5;
                    }

                    // 边界反弹
                    if (particle.x <= 0 || particle.x >= this.canvas.width) particle.dx *= -1;
                    if (particle.y <= 0 || particle.y >= this.canvas.height) particle.dy *= -1;

                    particle.x += particle.dx;
                    particle.y += particle.dy;
                });
            }

            animate = () => {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制粒子连线
                this.particles.forEach((a, i) => {
                    this.drawParticle(a);
                    this.particles.slice(i).forEach(b => {
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `rgba(255, 255, 255, ${1 - distance/100})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.moveTo(a.x, a.y);
                            this.ctx.lineTo(b.x, b.y);
                            this.ctx.stroke();
                        }
                    });
                });

                this.updateParticles();
                requestAnimationFrame(this.animate);
            }
        }

        // 初始化粒子系统
        const canvas = document.getElementById('particles-canvas');
        new ParticleSystem(canvas);
    </script>
</body>

</html>
