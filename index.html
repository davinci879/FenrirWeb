<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <meta name="keywords" content="专利，撰写, 检索, 服务, 流程, 文献查找，工具，辅助">
        <meta name="description" content="提供专业的专利撰写与检索服务，涵盖详细的专利申请流程指导和高效的专利文献查找方法。">
        <link rel="icon" href="static/ico.ico" type="image/x-icon">
        <title>专利智撰家 Q群 259303941 微信fenrir9999</title>
        <script type="text/javascript" src="static/dat.gui.min.js"></script>
        <link rel="icon" href="static/favicon.ico" type="image/x-icon">
        <style>
            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            .dg {
                opacity: 0.9;
            }

            .dg .property-name {
                overflow: visible;
            }

            .bigFont {
                font-size: 150%;
                color: #8C8C8C;
            }

            .cr.function.appBigFont {
                font-size: 150%;
                line-height: 27px;
                color: #A5F8D3;
                background-color: #023C40;
            }

            .cr.function.appBigFont .property-name {
                float: none;
            }

            .cr.function.appBigFont .icon {
                position: sticky;
                bottom: 27px;
            }

    
            .promo {
                display: none;
                /* display: table; */
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                overflow: auto;
                color: lightblue;
                background-color: rgba(0,0,0,0.4);
                animation: promo-appear-animation 0.35s ease-out;
            }

            .promo-middle {
                display: table-cell;
                vertical-align: middle;
            }

            .promo-content {
                width: 80vw;
                height: 80vh;
                max-width: 80vh;
                max-height: 80vw;
                margin: auto;
                padding: 0;
                font-size: 2.8vmax;
                font-family: Futura, "Trebuchet MS", Arial, sans-serif;
                text-align: center;
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                border-radius: 15px;
                box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            }

            .promo-header {
                height: 10%;
                padding: 2px 16px;
            }

            .promo-close {
                width: 10%;
                height: 100%;
                text-align: left;
                float: left;
                font-size: 1.3em;
                /* transition: 0.2s; */
            }

            .promo-close:hover {
                /* transform: scale(1.25); */
                cursor: pointer;
            }

            .promo-body {
                padding: 8px 16px 16px 16px;
                margin: auto;
            }

            .promo-body p {
                margin-top: 0;
                mix-blend-mode: color-dodge;
            }

            .link {
                width: 100%;
                display: inline-block;
            }

            .link img {
                width: 100%;
            }

            @keyframes promo-appear-animation {
                0% {
                    transform: scale(2.0);
                    opacity: 0;
                }
                100% {
                    transform: scale(1.0);
                    opacity: 1;
                }
            }
        /* 进入按钮样式 */
        #enter-button {
            position: absolute;
            width:120px;
            height:40px;
            top: 80%;
            left: 42%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            background: linear-gradient(0deg,  #000000 40%, #ffffff 100%); 
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 15px;
            transition: opacity 0.5s;
            opacity: 0.8; 
        }
        #reg-button {
            position: absolute;
            width:120px;
            height:40px;
            top: 80%;
            left: 58%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            background: linear-gradient(0deg,  #000000 40%, #ffffff 100%); 
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 15px;
            transition: opacity 0.5s;
            opacity: 0.8; 
        }
        #enter-button:hover,#reg-button:hover {
            opacity: 0.5;        
        }
        </style>
        <script>
            window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
            ga('create', 'UA-105392568-1', 'auto');
            ga('send', 'pageview');
            function goToPage(page) {
                window.location.href = `${page}`;
            }
            async function autoDirect() {
                await sleep(4000);
                goToPage('home');
            }
            function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        window.onload = autoDirect;
        </script>
    </head>
    <body>
        <canvas></canvas>

        <!-- Mother of God, pls forgive me -->
        <div class="promo">
            <div class="promo-middle">
                <div class="promo-content">
                    <div class="promo-header">
                        <span class="promo-close">&times;</span>
                    </div>
                    <div class="promo-body">
                        <div class="links-container">
                            <a class="link" id="apple_link" target="_blank">
                            </a>
                            <a class="link" id="google_link" target="_blank">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button id="enter-button" onclick="goToPage('home')">进入智撰家</button>
        <button id="reg-button" onclick="goToPage('register')">客户端注册</button>
        <script src="static/script.js"></script>
    </body>
</html>
